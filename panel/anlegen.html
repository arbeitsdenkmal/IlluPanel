<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Auftrag anlegen</title>
<style>
  :root { --bg: #323232; --fg: #e6e6e6; --muted: #9a9a9a; --line: #4a4a4a; --feld: #424242; --accent: #f29c14; }
  :root.hell { --bg: #f0f0f0; --fg: #1d1d1d; --muted: #6b6b6b; --line: #c8c8c8; --feld: #ffffff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, "Helvetica Neue", sans-serif; }
  body { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
  #arten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .art { padding: 5px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--feld); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; }
  .art[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--feld)); }
  .wahl { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
  .wahl label { flex-direction: row; align-items: center; gap: 4px; color: var(--fg); }
  .zusatz { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 12px; }
  label.haken { flex-direction: row; align-items: center; gap: 6px; color: var(--fg); }
  input { font: inherit; font-size: 13px; color: var(--fg); background: var(--feld); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  input[type=radio], input[type=checkbox] { padding: 0; }
  input:focus { outline: none; border-color: var(--accent); }
  .mass input { width: 90px; }
  .unten { display: flex; justify-content: flex-end; margin-top: auto; }
  #los { font: inherit; font-weight: 600; padding: 5px 18px; border: 0; border-radius: 4px; background: var(--accent); color: #1a1a1a; cursor: pointer; }
  #los:hover:not(:disabled) { filter: brightness(1.08); }
  #los:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <!-- SPEZ_01 §8, Zweig „ohne Auftrag“: Auftragsart, Kunde, Quelle; artabhängig Fahrzeugvorlage, Verfahren, Maße, Maßstab der Quelle -->
  <div id="arten" role="group" aria-label="Auftragsart"></div>
  <label>Kundenname <input id="kunde" type="text" autocomplete="off" spellcheck="false"></label>
  <div class="wahl" id="quelle" role="radiogroup">
    <label><input type="radio" name="quelle" id="qOffen" value="offen"> geöffnete Datei</label>
    <label><input type="radio" name="quelle" id="qDatei" value="datei"> Datei öffnen</label>
    <label><input type="radio" name="quelle" id="qLeer" value="leer"> leer</label>
  </div>
  <label id="zFahrzeug" class="haken" hidden><input id="fzV" type="checkbox"> Fahrzeugvorlage</label>
  <div id="zVerfahren" class="wahl" role="radiogroup" hidden>
    <label><input type="radio" name="verf" value="folie"> Folie</label>
    <label><input type="radio" name="verf" value="uv"> UV-Druck</label>
  </div>
  <div id="zMass" class="zusatz mass" hidden>
    <label>Breite <input id="breite" type="number" min="1" step="any"></label>
    <span>×</span>
    <label>Höhe <input id="hoehe" type="number" min="1" step="any"></label>
    <span class="wahl">mm</span>
    <label>Anzahl Zeichenflächen <input id="anzahl" type="number" min="1" step="1" value="1"></label>
  </div>
  <div id="zMassstab" class="wahl" role="radiogroup" hidden>
    <label><input type="radio" name="mst" value="1" checked> 1:1</label>
    <label><input type="radio" name="mst" value="30"> 1:30</label>
  </div>
  <div class="unten"><button id="los" disabled>Let's go</button></div>
  <script src="gemeinsam.js"></script>
  <script src="anlegen.js"></script>
</body>
</html>
