<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Auftrag anlegen</title>
<link rel="stylesheet" href="fenster.css">
<style>
  /* SPEZ_03_Oberflaeche §4, MOCKUP_THEMA6_Auftrag_2 (560 × 480) */
  .split { display: flex; gap: 12px; min-height: 0; }
  .artenL { display: flex; flex-direction: column; gap: 3px; width: 164px; flex: none; padding-right: 12px; border-right: 1px solid var(--line); }
  .artenL .art { height: 26px; text-align: left; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; }
  .feldseite { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .feld input { width: 100%; }
  #felder { display: flex; flex-direction: column; gap: 8px; }
  .haken { display: flex; align-items: center; gap: 6px; } .haken input { height: auto; margin: 0; padding: 0; }
  .reiheF { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .reiheF > span { padding-bottom: 4px; }
  .reiheF input { width: 80px; text-align: right; } .reiheF input#anzahl { width: 60px; }
  select.voll { width: 100%; }
</style>
</head>
<body>
  <!-- SPEZ_01 §8, Zweig „ohne Auftrag“; Aufbau SPEZ_03_Oberflaeche §4: links die Auftragsarten als Liste, rechts Kundenname, Quelle (Segment-Buttons), Linie und
       die Felder der Art: Fahrzeugvorlage, Verfahren und Material (Schild), Offset Produkt/Ausrichtung, Banner/Roll-up Variante, Textil Marke → Modell → Farbe,
       Maße und Anzahl Zeichenflächen, Maßstab der Quelle -->
  <main>
    <div class="split">
      <div class="artenL"><div class="cap">Auftragsart</div><div id="arten" class="senkrecht" role="group" aria-label="Auftragsart" style="gap:3px"></div></div>
      <div class="feldseite">
        <div class="feld"><div class="cap">Kundenname</div><input id="kunde" type="text" autocomplete="off" spellcheck="false"></div>
        <div id="quelle" class="seg eng voll" role="group"><button type="button" data-w="offen">geöffnete Datei</button><button type="button" data-w="datei">Datei öffnen</button><button type="button" data-w="leer">leer</button></div>
        <div id="felder" class="block">
          <label id="zFahrzeug" class="haken" hidden><input id="fzV" type="checkbox"> Fahrzeugvorlage</label>
          <div id="zVerfahren" class="seg eng voll" role="group" hidden><button type="button" data-w="folie">Folie</button><button type="button" data-w="uv">UV-Druck</button></div>
          <div id="zMaterial" hidden><div class="cap">Material</div><select id="material" class="voll"></select></div>
          <div id="zOffset" hidden><select id="produkt" class="voll"></select></div>
          <div id="zAusrichtung" class="seg eng voll" role="group" hidden><button type="button" data-w="hoch">hoch</button><button type="button" data-w="quer">quer</button></div>
          <div id="zVariante" class="seg eng" role="group" hidden></div>
          <div id="zTextil" hidden></div>
          <div id="zMass" class="reiheF" hidden>
            <div id="zBH" class="reiheF">
              <div class="feld"><div class="cap">Breite</div><input id="breite" type="number" min="1" step="any"></div>
              <span>×</span>
              <div class="feld"><div class="cap">Höhe</div><input id="hoehe" type="number" min="1" step="any"></div>
              <span class="muted">mm</span>
            </div>
            <div class="feld"><div class="cap">Anzahl Zeichenflächen</div><input id="anzahl" type="number" min="1" step="1" value="1"></div>
          </div>
          <div id="zMassstab" class="seg eng" role="group" hidden><button type="button" data-w="1">1:1</button><button type="button" data-w="30">1:30</button></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="fuss"><span class="hinweis"></span><button id="los" class="primaer" disabled>Let's go</button></footer>
  <script src="gemeinsam.js"></script>
  <script src="anlegen.js"></script>
</body>
</html>
