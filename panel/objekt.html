<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Objekt</title>
<link rel="stylesheet" href="fenster.css">
</head>
<body>
  <!-- SPEZ_03_Oberflaeche §5, MOCKUP_THEMA6_Zuordnen_2 A (480 × 440, Inhalt oben ausgerichtet): Zeile 1 Art als Segment-Buttons, rechts Anzahl (bei UV ohne);
       Digitaldruck Medium, Laminat; Plott Farben im Objekt, Farb-Nr. groß vor den Serien, Kachelraster (Schlüssel auch bei Mouseover);
       Komplexität (Plott, Druck mit Cutkontur), Aufschläge. Schild (SPEZ_03_Schild §8.1): zusätzlich UV-Vorn, UV-Hinten, ohne Tape -->
  <main>
    <div class="zeile">
      <div id="arten" class="seg" role="group" aria-label="Art"></div><span class="fuell"></span>
      <span id="anzahlL" class="lbl">Anzahl</span><span id="anzahlZ"><input id="anzahl" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" style="width:56px;text-align:right"></span>
    </div>
    <div id="druck" class="feldz">
      <span class="lbl">Medium</span><div id="medium" class="seg eng" role="group" aria-label="Medium"></div>
      <span class="lbl">Laminat</span><div id="laminat" class="seg eng" role="group" aria-label="Laminat"></div>
    </div>
    <div id="plott" class="block">
      <div class="lbl" style="margin-bottom:5px">Farben im Objekt</div>
      <div id="farben" class="farben"></div>
    </div>
    <div id="serieZ" class="zeile">
      <span class="lbl">Farb-Nr.</span><input id="farbNr" class="fnr" type="text" autocomplete="off" spellcheck="false"><span class="fuell"></span>
      <span id="serien" class="seg eng serie" style="flex-wrap:nowrap"></span>
    </div>
    <div id="raster" class="raster"></div>
    <div id="zusatz" class="block feldz">
      <span id="komplexL" class="lbl">Komplexität</span><div id="komplex" class="seg eng" role="group" aria-label="Komplexität"></div>
      <span id="attrL" class="lbl">Aufschläge</span><div id="attr" class="seg eng" role="group" aria-label="Aufschläge"></div>
    </div>
  </main>
  <footer class="fuss"><span id="hinweis" class="hinweis"></span><button id="abbrechen">Abbrechen</button><button id="ok" class="primaer" disabled>OK</button></footer>
  <script src="gemeinsam.js"></script>
  <script src="fenster.js"></script>
  <script src="objekt.js"></script>
</body>
</html>
