<html lang="de">
<head>
<meta charset="utf-8">
<title>Breite</title>
<link rel="stylesheet" href="fenster.css">

<body>
  <!-- SPEZ_03 §3, MockUp MOCKUP_STUFE3_Werkzeuge.html „Fenster Breite“: Zielbreite (vorbelegt mit der gemessenen Breite), umlaufende Zugabe (2) -->

    <label for="ziel">Zielbreite in mm?</label><input id="ziel" type="text" autocomplete="off" spellcheck="false">

  <footer class="fuss"><span id="hinweis" class="hinweis"></span><button id="abbrechen">Abbrechen</button><button id="ok" class="primaer" disabled>OK</button></footer>
