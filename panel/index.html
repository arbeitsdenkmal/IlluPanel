<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PAM-Werkzeuge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SPEZ_02 §13, MockUp A5/A7 (320 × 142, Inhalt 122 px): Kunde · Auftragsart | Grafik + „+m“; Objektzeile; add/edit · berechnen;
       Werkzeugzeile Summa · Druck · Export · Auftrag; Preiszeile „Material …“ links, „inkl. Mont. …“ rechts -->
  <div id="inhalt">
    <div class="z"><span id="kopf" class="wachsen"></span><span id="grafik" class="grafik muted" hidden><span id="grafikMin"></span> <input id="plusMin" class="min" placeholder="+m" readonly></span></div>
    <div class="z"><span id="objName" class="wachsen name"></span><span id="objFolie" class="muted"></span><span id="objAnzahl" class="marke" hidden></span></div>
    <div class="z"><button id="btnZuordnen" disabled>add</button><button id="btnBerechnen" disabled>berechnen</button></div>
    <div class="z wz"><button id="btnSumma" disabled>Summa</button><button id="btnDruck" disabled>Druck</button><button id="btnExport" class="akzent" disabled>Export</button><button id="btnAuftrag" class="akzent-schrift" disabled>Auftrag</button></div>
    <div class="z preis"><span id="preisMaterial" class="p1"></span><span id="preisMontage" class="p1"></span></div>
  </div>
  <script src="gemeinsam.js"></script>
  <script src="main.js"></script>
</body>
</html>
